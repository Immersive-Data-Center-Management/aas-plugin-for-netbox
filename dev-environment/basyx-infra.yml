infrastructures:
  default: infra1
  infra1:
    name: BaSyx
    components:
      aasDiscovery:
        baseUrl: "http://localhost:8084/lookup/shells"
      aasRegistry:
        baseUrl: "http://localhost:8082/shell-descriptors"
        hasDiscoveryIntegration: true
      submodelRegistry:
        baseUrl: "http://localhost:8083/submodel-descriptors"
      aasRepository:
        baseUrl: "http://localhost:8081/shells"
        hasRegistryIntegration: true
      submodelRepository:
        baseUrl: "http://localhost:8081/submodels"
        hasRegistryIntegration: true
      conceptDescriptionRepository:
        baseUrl: "http://localhost:8081/concept-descriptions"
    security:
      type: oauth2
      config:
        flow: auth_code
        issuer: "http://keycloak.localhost:8080/realms/basyx-dev"
        clientId: "aas-ui"
        scope: "openid profile email" 
