{% extends "base/layout.html" %}

{% block title %}Delete AAS Connection{% endblock %}

{% block content %}
<h1>Delete AAS Connection</h1>

<div class="alert alert-danger">
  <strong>Warning:</strong> Are you sure you want to delete <strong>{{ object.name }}</strong>?
  This action cannot be undone.
</div>

<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Yes, Delete</button>
  <a href="../../" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
